name: Deploy
on:
  push:
    branches:
      - main
    tags:
      - "!*"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v2
        with:
          repository: LLK/scratch-gui
          ref: develop
      - run: npm install
      - uses: actions/checkout@v2
        with:
          path: ./ai_translate
      - run: sh ./ai_translate/install.sh
      - run: npm run build
      - name: npm install under ai_translate
        run: npm install
        working-directory: ./ai_translate
      - name: Build ai_translate.mjs for xcratch
        run: npm run build
        working-directory: ./ai_translate
      - name: Copy ai_translate.mjs to build folder
        run: cp ./ai_translate/dist/ai_translate.mjs ./build
      - name: Copy sample.sb3 to build folder
        run: cp ./ai_translate/sample_projects/xcratch/sample.sb3 ./build
      - name: Create turbowarp folder
        run: mkdir -p ./build/turbowarp
      - name: Copy turbowarp extension to build folder
        run: cp ./ai_translate/turbowarp/index.js ./build/turbowarp
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
